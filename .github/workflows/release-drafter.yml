name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# Deliberately NOT cancel-in-progress. This workflow publishes releases, and
# cancelling one midway could leave a half-uploaded asset or a release created
# without its notes. Queued runs wait their turn instead.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from manifest.json
        id: get_version
        run: |
          # Robust extraction of the version value
          VERSION=$(jq -r '.version' custom_components/electrolux/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version found: $VERSION"

      - name: Read release notes
        id: release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          RELEASE_FILE="release_notes/RELEASE_NOTES_v${VERSION}.md"
          # A prerelease version (3.8.3-beta1) has no matching notes file and is
          # published by hand through the API. Detect that explicitly so the
          # skip is explained, rather than looking like the workflow broke.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Prerelease version ${VERSION} - published manually, nothing to do here."
            exit 0
          fi
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          if [ -f "$RELEASE_FILE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "title=Version ${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            # This used to be a bare echo buried in the log. A stable version
            # whose notes file is missing publishes nothing at all, silently -
            # so raise it into the run summary where it is actually read.
            echo "::warning title=No release notes::Version ${VERSION} is stable but ${RELEASE_FILE} does not exist, so no release was created."
            echo "::notice title=Missing release notes::Create ${RELEASE_FILE} before tagging ${VERSION}."
          fi

      - name: Create electrolux.zip asset
        if: github.event_name == 'push' && steps.release_notes.outputs.prerelease != 'true'
        run: |
          mkdir -p dist
          # -j (junk paths) is often preferred for HA components so the zip 
          # starts at the internal folder structure, but -r is fine for full custom_components
          zip -r dist/electrolux.zip custom_components

      - name: Create or Update Release
        if: steps.release_notes.outputs.found == 'true' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
          TITLE: ${{ steps.release_notes.outputs.title }}
          NOTES_PATH: "release_notes/RELEASE_NOTES_v${{ steps.get_version.outputs.version }}.md"
        run: |
          TAG="v${VERSION}"
          
          # Check for published release
          if gh release view "$TAG" --json isDraft | grep -q '"isDraft":false'; then
            echo "Published release $TAG already exists. Skipping."
            exit 0
          fi

          # Check if draft exists
          if gh release view "$TAG" --json isDraft | grep -q '"isDraft":true'; then
            echo "Updating existing draft release $TAG"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES_PATH"
            
            # Re-upload asset (delete if exists to avoid conflicts)
            gh release upload "$TAG" dist/electrolux.zip --clobber
          else
            echo "Creating new draft release $TAG"
            gh release create "$TAG" \
              dist/electrolux.zip \
              --draft \
              --title "$TITLE" \
              --notes-file "$NOTES_PATH"
          fi