name: Workflow lint

# A bad action reference or a malformed expression is only ever discovered when
# the workflow fails to run, which is especially costly here because a
# silently-broken job reports green.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      # Runs actionlint and shellcheck together, both pinned. It used to run
      # actionlint from a Docker image, which couples the two tools but makes
      # the check unavailable to anyone without Docker - and actionlint does
      # not warn when shellcheck is missing, it just checks less and passes.
      # The script fails loudly instead. It is the same script the pre-commit
      # hook and the editor task run, so a local run and this one agree.
      - name: Lint workflows
        run: uv run --frozen python .github/scripts/run_actionlint.py
