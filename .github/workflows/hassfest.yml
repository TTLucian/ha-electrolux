name: hassfest

on:
  pull_request:
  push:
  schedule:
    - cron:  '0 0 * * *'

concurrency:
  group: hassfest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
        - uses: "actions/checkout@v7"
          with:
            persist-credentials: false
        # Pinned to a commit SHA, not @master - same reasoning as hacs.yml:
        # a branch ref is neither reviewable here nor updatable by Dependabot.
        - uses: "home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d" # master
