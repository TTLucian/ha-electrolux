name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review is load-bearing: without it, marking a draft PR ready
    # fires no event here, so the PR reaches main having never been checked
    # as non-draft. Draft PRs are the norm in this repo, so this fires often.
    types: [opened, reopened, synchronize, edited, ready_for_review]

# Superseded runs are cancelled. Without this, three pushes in a minute queue
# three full runs and only the last to land reflects the code that shipped.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN permissions follow the repo's org settings. This
# workflow only ever needs to read the repository.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # A hung test run should fail rather than occupy a runner until the 6h default.
    timeout-minutes: 20

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 2️⃣ Resolve the Python version required by the latest Home Assistant release
      - name: Resolve HA Python requirement
        id: ha_python
        run: |
          REQUIRES=$(curl -s https://pypi.org/pypi/homeassistant/json | jq -r '.info.requires_python')
          # Extract major.minor from e.g. ">=3.13.2" → "3.13"
          VERSION=$(echo "$REQUIRES" | grep -oP '\d+\.\d+' | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Python version: $VERSION (HA requires: $REQUIRES)"

      # 3️⃣ Set up uv and that Python version
      - name: Set up uv with Python ${{ steps.ha_python.outputs.version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "${{ steps.ha_python.outputs.version }}"

      # 4️⃣ Install dependencies
      # --locked: uv.lock is committed and is what actually gets tested. Plain
      # `uv sync` may re-resolve and rewrite it, so CI would run against
      # dependencies nobody pinned. --locked fails when the lockfile and
      # pyproject.toml have drifted, which is exactly the signal wanted here.
      - name: Install dependencies
        run: |
          uv sync --group test --locked
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      # 5️⃣ Lint with Ruff (no auto-fix — fixes must be committed locally)
      - name: Lint with Ruff
        run: ruff check custom_components/electrolux tests

      # 6️⃣ Check formatting with Ruff (replaces Black)
      - name: Check formatting with Ruff
        run: ruff format --check --diff custom_components/electrolux tests

      # 7️⃣ Validate Home Assistant integration
      # Removed due to import issues in CI environment

      # 8️⃣ Type checking with mypy
      # Two separate invocations on purpose: passing both paths in one command
      # trips mypy's "Source file found twice under different module names"
      # because the component is importable as both `electrolux.*` and
      # `custom_components.electrolux.*`.
      - name: Run mypy type checks
        run: |
          mypy custom_components/electrolux --ignore-missing-imports
          mypy tests --ignore-missing-imports

      # 9️⃣ Run tests with coverage
      # No --cov-fail-under here on purpose. The floor is fail_under in
      # pyproject.toml's [tool.coverage.report], so this job, the pre-commit
      # pytest hook and a bare `pytest --cov=...` all enforce the same number.
      # It was duplicated in three places and had already drifted apart.
      - name: Run tests
        run: pytest -v --cov=custom_components/electrolux --cov-report=term-missing

      # 🔟 Check for dirty files
      - name: Check for dirty files
        run: |
          # Only check for modified tracked files, ignore untracked files
          if [ -n "$(git diff --name-only)" ] || [ -n "$(git diff --cached --name-only)" ]; then
            echo "Repository is dirty after running checks. Please run the checks locally and commit the changes."
            git status
            exit 1
          fi