[project]
name = "ha-electrolux"
version = "0.0.0"
requires-python = ">=3.14.2,<3.15"

[tool.uv]
default-groups = ["dev", "test"]

[dependency-groups]
# Prefer the newest compatible releases within the supported compatibility ranges.
test = [
    "homeassistant>=2026.9.4,<2027.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.0.0",
    "types-PyYAML>=6.0",
    "aiohttp>=3.14.3,<4.0.0",
    "pyjwt>=2.15.1,<3.0.0",
    "electrolux-group-developer-sdk>=0.7.0",
    "mypy>=2.3.1",
    "ruff>=0.16.9",
]
dev = [
    "aiohttp>=3.14.3,<4.0.0",
    "deep_translator",
    "pydantic>=2.13.5,<3.0.0",
    "electrolux-group-developer-sdk>=0.7.0",
    "pre-commit",
    # Ships the shellcheck binary inside the venv, so the workflow linter
    # gets a pinned shellcheck without a system install or Docker.
    "shellcheck-py>=0.11.0",
]

# The coverage floor lives here and nowhere else. CI (ci.yml) and the
# pre-commit pytest hook both call `pytest --cov=...` with no --cov-fail-under
# argument, so they pick this up from coverage's own config. It was previously
# spelled out in three places - the workflow, the hook, and AGENTS.md - and had
# already drifted to 70 in one of them against 90 in the others, with a gate
# that could not fail either way.
[tool.coverage.report]
fail_under = 90

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [".venv", "__pycache__", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
# E/F/UP matches the sibling repositories; I adds import sorting, without
# which the same file formatted differently in each checkout.
# The ignores below name rules that are deliberately NOT selected:
# they record intent for when those rule sets are ever enabled.
select = ["E", "F", "UP", "I"]
ignore = [
    # Line length is enforced by ruff format, not by the linter, matching
    # the sibling repositories.
    "E501",
    "BLE001",
    "G201",
    "S110",
    "SIM102",
    "SIM103",
    "TRY203",
    "TRY401",
]

[[tool.mypy.overrides]]
# deep_translator ships no type information at all (no py.typed, no stubs), so
# importing it is always an "untyped import" error. It is only used by the
# offline translation script, which is not part of the integration's runtime.
module = ["deep_translator.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Unit tests replace bound methods with MagicMock()/closure doubles on purpose;
# that is the standard way to exercise error paths without a real appliance.
# Scoped to the test tree only - custom_components/ stays fully type-checked
# (CI runs `mypy custom_components/electrolux`, which this override cannot affect).
module = "tests.*"
disable_error_code = ["method-assign"]
