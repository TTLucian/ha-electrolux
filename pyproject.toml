[project]
name = "ha-electrolux"
version = "0.0.0"
requires-python = ">=3.14.2,<3.15"

[tool.uv]
default-groups = ["dev", "test"]

[dependency-groups]
# Prefer the newest compatible releases within the supported compatibility ranges.
test = [
    "homeassistant>=2026.8.3,<2027.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "pyjwt>=2.12.1,<3.0.0",
    "electrolux-group-developer-sdk",
    "mypy>=2.3.1",
    "ruff>=0.16.4",
]
dev = [
    "aiohttp>=3.14.3,<4.0.0",
    "deep_translator",
    "pydantic>=2.13.4,<3.0.0",
    "electrolux-group-developer-sdk",
    "pre-commit",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [".venv", "__pycache__", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
ignore = [
    "BLE001",
    "G201",
    "S110",
    "SIM102",
    "SIM103",
    "TRY203",
    "TRY401",
]
