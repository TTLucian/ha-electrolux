repos:
  # These revs must track the tool versions in pyproject.toml / uv.lock.
  # Hooks that drift from the locked versions can pass on things CI rejects, or
  # fail on things CI accepts, and a mirror that does not mirror reads as a
  # passing check. Dependabot does not edit this file, so re-check the revs
  # after merging its "uv" pull requests.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
        # Matches every path CI checks, by directory rather than by the
        # integration name, so this file is identical across repositories.
        files: ^(custom_components/|tests/|scripts/|\.github/scripts/)
      - id: ruff-format
        files: ^(custom_components/|tests/|scripts/|\.github/scripts/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args:
          # tests/ may be a namespace package, so the package-bases flags are
          # required; without them the hook dies with "Source file found twice
          # under different module names", because it hands mypy individual file
          # paths. Harmless where tests/ is a regular package.
          - --namespace-packages
          - --explicit-package-bases
        files: ^(custom_components/|tests/|scripts/|\.github/scripts/)
        additional_dependencies:
          - homeassistant
          - types-PyYAML
          - pyyaml
          - packaging


  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock is up to date
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        stages: [pre-push]

      # CI runs the same script, so a local run and CI check identically. Both
      # tools are pinned: shellcheck ships inside the venv via shellcheck-py,
      # and the script fetches actionlint at a fixed version. It fails loudly
      # if either is missing, because actionlint alone silently skips every
      # shellcheck rule rather than reporting that it skipped them.
      - id: workflow-lint
        name: actionlint + shellcheck
        entry: uv run --frozen python .github/scripts/run_actionlint.py
        language: system
        pass_filenames: false
        files: ^\.github/workflows/
