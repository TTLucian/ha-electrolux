repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
        files: ^custom_components/electrolux/
      - id: ruff-format
        files: ^custom_components/electrolux/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        files: ^custom_components/electrolux/
        additional_dependencies:
          - homeassistant

  # CI runs actionlint from its Docker image. Using the identical image and
  # version here means a local run checks exactly what CI checks. The plain
  # `actionlint` hook would compile via Go and, critically, would skip every
  # shellcheck rule when shellcheck is absent locally - which is how 8 SC2086
  # findings got to CI before. Requires Docker.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        # Kept in step with CI's --cov-fail-under. When this was 70 against a
        # ~96% actual, the hook passed on regressions that CI would reject.
        args: [--cov=custom_components/electrolux, --cov-fail-under=90, -q]
        stages: [push]
