repos:
  # These revs must track the tool versions in pyproject.toml / uv.lock. They
  # sat at ruff v0.15.17 and mypy v2.1.0 while the project ran ruff 0.16.9 and
  # mypy 2.3.1, so the hooks could pass on things CI rejected. A mirror that
  # does not mirror is worse than none, because it reads as a passing check.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
        # CI runs ruff over the component AND tests. Scoping the hook to the
        # component alone left every file in tests/ unchecked until CI said so.
        files: ^(custom_components/electrolux/|tests/)
      - id: ruff-format
        files: ^(custom_components/electrolux/|tests/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args:
          - --ignore-missing-imports
          # Without this the hook dies with "Source file found twice under
          # different module names" (electrolux.* vs custom_components.electrolux.*),
          # because it hands mypy individual file paths. CI avoids it by running
          # two separate invocations; the flag gets the same result in one pass.
          - --explicit-package-bases
        files: ^(custom_components/electrolux/|tests/)
        additional_dependencies:
          - homeassistant

  # CI runs actionlint from its Docker image. Using the identical image and
  # version here means a local run checks exactly what CI checks. The plain
  # `actionlint` hook would compile via Go and, critically, would skip every
  # shellcheck rule when shellcheck is absent locally - which is how 8 SC2086
  # findings got to CI before. Requires Docker.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        # Kept in step with CI's --cov-fail-under. When this was 70 against a
        # ~96% actual, the hook passed on regressions that CI would reject.
        args: [--cov=custom_components/electrolux, --cov-fail-under=90, -q]
        stages: [pre-push]
